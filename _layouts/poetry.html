<!-- Translation Toggle Script -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const button = document.getElementById('toggle-translation');
  if (!button) return;

  const translations = document.querySelectorAll('.poem .translation');

  let visible = false;

  translations.forEach(t => t.style.display = 'none');

  button.addEventListener('click', () => {
    visible = !visible;

    translations.forEach(t => {
      t.style.display = visible ? 'block' : 'none';
    });

    button.textContent = visible ? 'Hide translation' : 'Show translation';
    button.setAttribute('aria-pressed', visible);
  });
});
</script>
