---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="folio{% if page.url == '/' %} is-home{% endif %} layout--{{ page.layout | default: 'default' }}">
    <div class="grain" aria-hidden="true"></div>
    <div class="progress" aria-hidden="true"></div>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer class="colophon">
        {% include footer.html %}
        {% include footer/custom.html %}
      </footer>
    </div>

    <dialog class="lightbox" id="lightbox" aria-label="Full-size photo">
      <figure class="lightbox__print">
        <img src="" alt="Portrait of {{ site.author.name }}">
        <figcaption>{{ site.author.name }}</figcaption>
      </figure>
      <button class="lightbox__close" type="button" aria-label="Close">&times;</button>
    </dialog>

    <script>
      (function () {
        var box = document.getElementById('lightbox');
        if (!box || !box.showModal) return;
        var img = box.querySelector('img');
        document.querySelectorAll('.portrait-open').forEach(function (btn) {
          btn.addEventListener('click', function () {
            img.src = btn.getAttribute('data-full');
            box.showModal();
          });
        });
        /* any click closes it: on the print, the backdrop or the button */
        box.addEventListener('click', function () { box.close(); });
      })();
    </script>

    {% include scripts.html %}
  </body>
</html>
